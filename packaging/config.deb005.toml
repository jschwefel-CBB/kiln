# kiln config for deb005 (the RTX A4000 box). The live copy lives at
# /opt/kiln/config.toml (installed from this file by install.sh). inbox/scratch/state
# live on the Samsung 980 PRO (/dev/nvme1n1p1, mounted /var/content) — a large, near-empty
# volume — to keep 60–120 GB master drops and transcode scratch off the smaller boot fs.
# They MUST stay on one filesystem together: the watcher enqueues a job by os.rename-ing
# the job folder from inbox into state/queued, and os.rename cannot cross filesystems.
# Archives are the ark NFS mounts.

inbox       = "/var/content/kiln/inbox"
scratch_dir = "/var/content/kiln/scratch"
state_dir   = "/var/content/kiln/state"

# The storage server's NFS mounts — already mounted via /etc/fstab (_netdev,nofail).
masters_archive = "/mnt/masters"
exports_archive = "/mnt/exports"

# Master retention. The kiln-prune.timer runs `kiln prune` daily, but it deletes nothing
# until prune_masters=true. A master is pruned only if it is older than retention_days AND
# its exports (upload.mp4 + result.json ok:true) are confirmed on the exports pool; a job
# with options.keep_master=true (→ .keep_master marker) is never pruned. Preview anytime:
# `kiln --config /opt/kiln/config.toml prune --dry-run`.
prune_masters = false
retention_days = 90

whisper_model = "auto"       # large-v3 on the A4000's VRAM (GPU needs install.sh --gpu-whisper)
llm_model = "llama3.1:8b"    # pulled on deb005
codec = "auto"               # HEVC 4K / H.264 <=1080p; A4000 = no AV1
target_lufs = -14

[jobs]
transcode = true
captions  = true
normalize = true
chapters  = true
metadata  = true
upscale   = false            # opt-in; needs realesrgan-ncnn-vulkan

# Instant-trigger ping endpoint. Default 127.0.0.1 = localhost-only (safe default). To let
# the Mac helper POST /submit for instant pickup, set host = "0.0.0.0" (all interfaces —
# portable, not tied to any IP) and restart. The endpoint takes no payload; it only makes
# kiln scan its inbox now instead of within ~2s. The live deb005 box uses "0.0.0.0".
[submit]
host = "127.0.0.1"
port = 8765
