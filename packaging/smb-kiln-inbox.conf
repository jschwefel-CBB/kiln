; kiln $INBOX Samba share for deb005 — the Mac mounts this and FCP exports masters into it.
; Append this stanza to /etc/samba/smb.conf (or drop into an include), then create a
; dedicated, single-purpose drop user and give it an SMB password:
;   sudo useradd --system --no-create-home --shell /usr/sbin/nologin -g kiln kilndrop
;   sudo smbpasswd -a kilndrop
;   sudo systemctl restart smbd
; Connect from the Mac:  smb://deb005/kiln-inbox   (Registered User = kilndrop, NOT guest)
;
; Guest access is intentionally OFF (same policy as ark). Use a dedicated drop user with
; its own password — not a personal login, not the kiln service account. It must be in the
; kiln group so it can write the inbox (install.sh makes the inbox setgid 2775).
; See docs/deb005-deployment.md §4 for the full procedure incl. a write-test.

[kiln-inbox]
   path = /var/content/kiln/inbox
   comment = kiln master drop inbox
   browseable = yes
   read only = no
   guest ok = no
   valid users = @kiln kiln
   create mask = 0664
   directory mask = 0775
   ; force group so kiln (the service user) can always read what the Mac writes
   force group = kiln
