# kiln configuration — copy to config.toml and edit for your machine.
# No real paths or secrets are committed to the repo; this file is a documented template.

# ---------------------------------------------------------------------------
# Storage paths (the three that matter most)
# ---------------------------------------------------------------------------

# $INBOX — where masters are dropped. This is a LOCAL directory on the kiln box,
# typically exported to your workstation as an SMB share so the editor can write
# straight into it. kiln watches this directory for new job folders.
inbox = "/var/lib/kiln/inbox"

# $SCRATCH — local working space on fast NVMe. All processing happens here so no
# network I/O occurs mid-job. Cleared automatically after a job is archived.
scratch_dir = "/var/lib/kiln/scratch"

# kiln archives to TWO write-once destinations, so the large, irreplaceable
# masters and the small, re-derivable export packages can live on separate
# storage tiers (e.g. a double-parity pool for masters, a cheaper single-parity
# pool for exports). A job lands as:
#     <masters_archive>/<job_id>/master.mov
#     <exports_archive>/<job_id>/{upload.mp4,captions.srt,transcript.txt,...}
#
# Leave EITHER as "" to run WITHOUT that destination: completed jobs hold in a
# local pending-archive queue and flush once the path is set.

# $MASTERS_ARCHIVE — where ProRes masters go. Large and irreplaceable; put this
# on your most protected pool (e.g. RAIDZ2). Subject to master pruning below.
#
# Examples:
#   masters_archive = "/mnt/masters/kiln"         # a mounted NFS/SMB share
#   masters_archive = ""                          # no masters archive yet (hold locally)
masters_archive = ""

# $EXPORTS_ARCHIVE — where the finished export package (upload video + captions,
# transcript, chapters, metadata) goes. Kept forever; can be re-derived from the
# master if ever lost, so a cheaper pool (e.g. RAIDZ1) is fine.
#
# Examples:
#   exports_archive = "/mnt/exports/kiln"         # a mounted NFS/SMB share
#   exports_archive = ""                          # no exports archive yet (hold locally)
exports_archive = ""

# Where the pending-archive queue and job state live (local, persistent).
state_dir = "/var/lib/kiln/state"

# ---------------------------------------------------------------------------
# Master retention / pruning
# ---------------------------------------------------------------------------
# ProRes masters are large (~220 GB/hr at 4K). kiln can prune archived masters
# after a rolling window, keeping the compressed upload + artifacts permanently.
#
# OFF by default — a fresh install never deletes anyone's masters. Enable
# explicitly once you understand the behavior. A master is deleted ONLY if the
# exports_archive is reachable AND the upload plus all derived artifacts are
# confirmed present in exports_archive/<job_id>/, and never for a job whose
# job.json set "keep_master": true. (The master and its exports live on separate
# pools, so pruning must verify the *exports* pool before removing the master.)
prune_masters = false
retention_days = 90

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------

# Whisper model. "auto" picks the largest that fits detected VRAM (large-v3 on
# >=~10 GB, smaller otherwise). Override with an explicit model name if desired.
whisper_model = "auto"

# Ollama model for metadata drafts. Runs on GPU if available, else CPU.
llm_model = "llama3.1:8b"

# ---------------------------------------------------------------------------
# Transcode defaults
# ---------------------------------------------------------------------------

# "auto" selects codec by source resolution: HEVC for 4K, H.264 High for <=1080p.
# AV1 is offered only on Ada/RTX-40-series or newer cards.
codec = "auto"

# Target loudness for the normalize step (YouTube's reference is -14 LUFS).
target_lufs = -14

# Default per-job toggles (a job.json sidecar overrides these per submission).
[jobs]
transcode = true
captions  = true
normalize = true
chapters  = true
metadata  = true
upscale   = false   # opt-in; heavy on <=16 GB cards

# ---------------------------------------------------------------------------
# Submit endpoint (localhost-only instant-trigger ping; the watcher also polls)
# ---------------------------------------------------------------------------
[submit]
host = "127.0.0.1"
port = 8765
